<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Basic-Fit QR</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#5b2c91" />
    <meta name="color-scheme" content="light" />

    <!-- iOS install / standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Basic-Fit" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Configuration Form -->
    <div id="configSection">
      <h1>Configuratie</h1>

      <div class="form-group">
        <label for="cardNumber">Kaartnummer</label>
        <input type="text" id="cardNumber" placeholder="V00123456" />
      </div>

      <div class="form-group">
        <label for="deviceId">Apparaat-ID</label>
        <input
          type="text"
          id="deviceId"
          placeholder="A1B2C3D4-5E6F-7890-ABCD-EF1234567890"
        />
      </div>

      <div class="form-group">
        <label for="constant">Constante</label>
        <input type="text" id="constant" placeholder="3M9" />
      </div>

      <button id="generateBtn" class="btn">QR-code genereren</button>
      <button id="debugBtn" class="btn-debug" type="button">Debugmodus</button>
    </div>

    <!-- Debug / original QR Display -->
    <div id="qrSectionDebug" style="display: none">
      <canvas id="qrCanvasDebug"></canvas>
      <p id="qrDataDebug" class="qr-data"></p>
      <div class="progress-container">
        <div id="progressBarDebug" class="progress-bar"></div>
      </div>
      <div class="skip-controls">
        <button id="skipQrBtnDebug" class="btn-skip" type="button">Volgende vernieuwing forceren</button>
      </div>
      <button id="backBtnDebug" class="btn btn-secondary" type="button">
        Terug naar configuratie
      </button>
    </div>

    <!-- QR Code Display -->
    <div id="qrSection" style="display: none">
      <div class="qr-header">
        <button id="closeBtn" class="icon-btn" type="button" aria-label="Sluiten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="qr-body">
        <div class="qr-stack">
          <div class="qr-card-wrap">
            <div class="qr-inner">
              <canvas id="qrCanvas"></canvas>
              <span class="qr-badge">Kaartnummer <span id="qrCardNumber"></span></span>
            </div>
          </div>
          <div class="qr-progress">
            <div id="qrProgressBar" class="qr-progress-bar"></div>
          </div>
        </div>
        <div class="qr-text">
          <h1 class="qr-title">Jouw QR-code</h1>
          <p class="qr-description">
            Scan deze QR-code om de club te betreden of om gebruik te maken
            van de Opties. Houd je QR-code op ongeveer 20 cm van de scanner.
          </p>
        </div>
      </div>

      <div class="qr-cta-wrap">
        <button id="helpBtn" class="btn-cta" type="button">
          Zo werkt het
        </button>
        <button id="feedbackBtn" class="btn-feedback" type="button">
          Geef jouw mening
        </button>
      </div>
    </div>

    <script src="dist/main.js"></script>
    <script>
      const isLocal =
        location.hostname === "localhost" || location.hostname === "127.0.0.1";

      if ("serviceWorker" in navigator && !isLocal) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .catch((err) => console.warn("SW registration failed", err));
        });
      }
    </script>
  </body>
</html>
